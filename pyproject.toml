[project]
name = "alpha-centauri-solar-sail"
version = "0.1.0"
description = "ASS: mission software for a solar sail to Alpha Centauri, written well ahead of the sail."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["astropy>=7", "numpy>=2", "scipy>=1.14"]

[project.scripts]
ass = "ass.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ass --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.ruff]
line-length = 100
